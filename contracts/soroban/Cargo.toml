[workspace]
resolver = "2"
members = [
  "contracts/crowdpay",
  "contracts/escrow",
  "contracts/matching_pool",
  "contracts/milestones",
  "contracts/fee_registry",
]
# contracts/matching_pool holds a bare lib.rs with no Cargo.toml and no src/
# layout, so the members glob above picks it up and fails the whole workspace.
# Excluded until that contract is given a manifest.
exclude = [
  "contracts/matching_pool",
]

[workspace.dependencies]
soroban-sdk = "21.3.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
